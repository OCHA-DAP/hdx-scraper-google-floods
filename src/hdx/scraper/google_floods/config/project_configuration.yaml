# Collector specific configuration
base_url: "https://floodforecasting.googleapis.com/v1"

dataset_info:
  name: "google-floods-significant-events"
  title: "Significant Flood Events"
  csv_resource_name: "significant_flood_events.csv"
  csv_resource_description: "Significant flood events starting on {start_date}"
  json_resource_name: "significant_flood_events.geojson"
  json_resource_description: "Significant flood event geometry starting on {start_date}"
  headers:
    - startTime
    - minimumEndTime
    - endTime
    - affectedCountryCodes
    - affectedCountryISO3s
    - affectedPopulation
    - areaKm2
    - gaugeIds
    - eventPolygonId
    - eventTrackingIds
  tags:
    - "flooding"
    - "natural disaster"
